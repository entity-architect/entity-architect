<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Architect Designer</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --bg-hover: #22222e;
            --border: #2a2a3a;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --text-muted: #5a5a70;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-muted: #4f46e520;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        .app {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        .logo-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        
        .entity-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        
        .entity-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            transition: all 0.15s;
        }
        
        .entity-item:hover {
            background: var(--bg-hover);
        }
        
        .entity-item.active {
            background: var(--accent-muted);
            border: 1px solid var(--accent);
        }
        
        .entity-icon {
            width: 32px;
            height: 32px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .entity-name {
            font-weight: 500;
            font-size: 14px;
        }
        
        .entity-props-count {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .add-entity-btn {
            margin: 12px;
            padding: 12px;
            background: transparent;
            border: 1px dashed var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.15s;
        }
        
        .add-entity-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-muted);
        }
        
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .toolbar {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
        }
        
        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: var(--danger-hover);
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }
        
        .spacer {
            flex: 1;
        }
        
        .save-status {
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .save-status.saved {
            color: var(--success);
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-state-text {
            font-size: 16px;
        }
        
        .entity-editor {
            max-width: 900px;
        }
        
        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .section-title {
            font-size: 15px;
            font-weight: 600;
        }
        
        .section-content {
            padding: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .form-row:last-child {
            margin-bottom: 0;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .form-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .form-input {
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: all 0.15s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-muted);
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
        }
        
        select.form-input {
            cursor: pointer;
        }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .checkbox-item:hover {
            border-color: var(--text-muted);
        }
        
        .checkbox-item.checked {
            border-color: var(--accent);
            background: var(--accent-muted);
        }
        
        .checkbox-item input {
            display: none;
        }
        
        .checkbox-label {
            font-size: 13px;
            user-select: none;
        }
        
        .property-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .property-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .property-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .property-header:hover {
            background: var(--bg-hover);
        }
        
        .property-type-badge {
            padding: 4px 10px;
            background: var(--bg-primary);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
        }
        
        .property-name {
            font-weight: 500;
            font-size: 14px;
            flex: 1;
        }
        
        .property-badges {
            display: flex;
            gap: 6px;
        }
        
        .property-badge {
            padding: 3px 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .property-badge.relation {
            color: var(--warning);
        }
        
        .property-actions {
            display: flex;
            gap: 8px;
        }
        
        .icon-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .icon-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .icon-btn.danger:hover {
            background: var(--danger);
            color: white;
        }
        
        .property-details {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-primary);
        }
        
        .relation-config {
            margin-top: 16px;
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        
        .relation-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--warning);
        }
        
        .add-property-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px dashed var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.15s;
        }
        
        .add-property-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-muted);
        }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease;
        }
        
        .toast.success {
            border-color: var(--success);
        }
        
        .toast.error {
            border-color: var(--danger);
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        
        const API_BASE = '/__designer';
        
        function App() {
            const [model, setModel] = useState({ entities: [], sqlModels: [] });
            const [selectedEntity, setSelectedEntity] = useState(null);
            const [expandedProps, setExpandedProps] = useState({});
            const [saveStatus, setSaveStatus] = useState('');
            const [toast, setToast] = useState(null);
            const [schema, setSchema] = useState(null);
            
            useEffect(() => {
                loadModel();
                loadSchema();
            }, []);
            
            const loadModel = async () => {
                try {
                    const res = await fetch(`${API_BASE}/model`);
                    const data = await res.json();
                    setModel(data || { entities: [], sqlModels: [] });
                } catch (err) {
                    showToast('Failed to load model', 'error');
                }
            };
            
            const loadSchema = async () => {
                try {
                    const res = await fetch(`${API_BASE}/schema`);
                    const data = await res.json();
                    setSchema(data);
                } catch (err) {
                    console.error('Failed to load schema', err);
                }
            };
            
            const saveModel = async () => {
                try {
                    setSaveStatus('Saving...');
                    const res = await fetch(`${API_BASE}/model`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(model)
                    });
                    const data = await res.json();
                    if (data.success) {
                        setSaveStatus('Saved');
                        showToast('Model saved successfully!', 'success');
                        setTimeout(() => setSaveStatus(''), 2000);
                    }
                } catch (err) {
                    setSaveStatus('Error');
                    showToast('Failed to save model', 'error');
                }
            };
            
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };
            
            const addEntity = () => {
                const name = prompt('Entity name:');
                if (!name) return;
                
                const newEntity = {
                    name,
                    properties: [],
                    cannotCreate: false,
                    cannotUpdate: false,
                    cannotDelete: false,
                    cannotGetById: false,
                    hasLightList: false,
                    getListPaginated: false,
                    paginatedItemCount: null
                };
                
                setModel(prev => ({
                    ...prev,
                    entities: [...prev.entities, newEntity]
                }));
                setSelectedEntity(newEntity.name);
            };
            
            const updateEntity = (entityName, updates) => {
                setModel(prev => ({
                    ...prev,
                    entities: prev.entities.map(e => 
                        e.name === entityName ? { ...e, ...updates } : e
                    )
                }));
            };
            
            const deleteEntity = (entityName) => {
                if (!confirm(`Delete entity "${entityName}"?`)) return;
                
                setModel(prev => ({
                    ...prev,
                    entities: prev.entities.filter(e => e.name !== entityName)
                }));
                
                if (selectedEntity === entityName) {
                    setSelectedEntity(null);
                }
            };
            
            const addProperty = (entityName) => {
                const newProp = {
                    name: 'NewProperty',
                    type: 'string',
                    ignorePostRequest: false,
                    ignorePutRequest: false,
                    includeInGet: false,
                    includingDeep: null,
                    lightListProperty: false,
                    relation: null
                };
                
                updateEntity(entityName, {
                    properties: [...(model.entities.find(e => e.name === entityName)?.properties || []), newProp]
                });
                
                setExpandedProps(prev => ({
                    ...prev,
                    [`${entityName}-${newProp.name}`]: true
                }));
            };
            
            const updateProperty = (entityName, propIndex, updates) => {
                const entity = model.entities.find(e => e.name === entityName);
                if (!entity) return;
                
                const newProps = [...entity.properties];
                newProps[propIndex] = { ...newProps[propIndex], ...updates };
                
                updateEntity(entityName, { properties: newProps });
            };
            
            const deleteProperty = (entityName, propIndex) => {
                const entity = model.entities.find(e => e.name === entityName);
                if (!entity) return;
                
                const newProps = entity.properties.filter((_, i) => i !== propIndex);
                updateEntity(entityName, { properties: newProps });
            };
            
            const togglePropExpand = (entityName, propName) => {
                const key = `${entityName}-${propName}`;
                setExpandedProps(prev => ({ ...prev, [key]: !prev[key] }));
            };
            
            const currentEntity = model.entities.find(e => e.name === selectedEntity);
            
            return (
                <div className="app">
                    <aside className="sidebar">
                        <div className="sidebar-header">
                            <div className="logo">Entity Architect</div>
                            <div className="logo-sub">Visual Designer</div>
                        </div>
                        
                        <div className="entity-list">
                            {model.entities.map(entity => (
                                <div 
                                    key={entity.name}
                                    className={`entity-item ${selectedEntity === entity.name ? 'active' : ''}`}
                                    onClick={() => setSelectedEntity(entity.name)}
                                >
                                    <div className="entity-icon">📦</div>
                                    <div>
                                        <div className="entity-name">{entity.name}</div>
                                        <div className="entity-props-count">
                                            {entity.properties?.length || 0} properties
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <button className="add-entity-btn" onClick={addEntity}>
                            + Add Entity
                        </button>
                    </aside>
                    
                    <main className="main">
                        <div className="toolbar">
                            <button className="btn btn-primary" onClick={saveModel}>
                                💾 Save Migration
                            </button>
                            <button className="btn btn-secondary" onClick={loadModel}>
                                🔄 Reload
                            </button>
                            <div className="spacer"></div>
                            {saveStatus && (
                                <span className={`save-status ${saveStatus === 'Saved' ? 'saved' : ''}`}>
                                    {saveStatus}
                                </span>
                            )}
                        </div>
                        
                        <div className="content">
                            {!currentEntity ? (
                                <div className="empty-state">
                                    <div className="empty-state-icon">🏗️</div>
                                    <div className="empty-state-text">
                                        Select an entity or create a new one
                                    </div>
                                </div>
                            ) : (
                                <div className="entity-editor">
                                    <div className="section">
                                        <div className="section-header">
                                            <span className="section-title">Entity: {currentEntity.name}</span>
                                            <button 
                                                className="btn btn-danger btn-sm"
                                                onClick={() => deleteEntity(currentEntity.name)}
                                            >
                                                Delete
                                            </button>
                                        </div>
                                        <div className="section-content">
                                            <div className="form-row">
                                                <div className="form-group">
                                                    <label className="form-label">Name</label>
                                                    <input 
                                                        className="form-input"
                                                        value={currentEntity.name}
                                                        onChange={e => {
                                                            const oldName = currentEntity.name;
                                                            const newName = e.target.value;
                                                            setModel(prev => ({
                                                                ...prev,
                                                                entities: prev.entities.map(ent =>
                                                                    ent.name === oldName ? { ...ent, name: newName } : ent
                                                                )
                                                            }));
                                                            setSelectedEntity(newName);
                                                        }}
                                                    />
                                                </div>
                                            </div>
                                            
                                            <div className="form-group" style={{marginTop: '16px'}}>
                                                <label className="form-label">CRUD Options</label>
                                                <div className="checkbox-group">
                                                    {[
                                                        ['cannotCreate', 'No Create'],
                                                        ['cannotUpdate', 'No Update'],
                                                        ['cannotDelete', 'No Delete'],
                                                        ['cannotGetById', 'No Get By ID'],
                                                        ['hasLightList', 'Light List'],
                                                        ['getListPaginated', 'Paginated']
                                                    ].map(([key, label]) => (
                                                        <label 
                                                            key={key}
                                                            className={`checkbox-item ${currentEntity[key] ? 'checked' : ''}`}
                                                        >
                                                            <input 
                                                                type="checkbox"
                                                                checked={currentEntity[key] || false}
                                                                onChange={e => updateEntity(currentEntity.name, { [key]: e.target.checked })}
                                                            />
                                                            <span className="checkbox-label">{label}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                            
                                            {currentEntity.getListPaginated && (
                                                <div className="form-row" style={{marginTop: '16px'}}>
                                                    <div className="form-group">
                                                        <label className="form-label">Items per page</label>
                                                        <input 
                                                            className="form-input"
                                                            type="number"
                                                            value={currentEntity.paginatedItemCount || 10}
                                                            onChange={e => updateEntity(currentEntity.name, { 
                                                                paginatedItemCount: parseInt(e.target.value) || 10 
                                                            })}
                                                        />
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-header">
                                            <span className="section-title">Properties</span>
                                        </div>
                                        <div className="section-content">
                                            <div className="property-list">
                                                {currentEntity.properties?.map((prop, idx) => {
                                                    const isExpanded = expandedProps[`${currentEntity.name}-${prop.name}`];
                                                    return (
                                                        <div key={idx} className="property-item">
                                                            <div 
                                                                className="property-header"
                                                                onClick={() => togglePropExpand(currentEntity.name, prop.name)}
                                                            >
                                                                <span className="property-type-badge">{prop.type}</span>
                                                                <span className="property-name">{prop.name}</span>
                                                                <div className="property-badges">
                                                                    {prop.relation && (
                                                                        <span className="property-badge relation">
                                                                            {prop.relation.type}
                                                                        </span>
                                                                    )}
                                                                    {prop.ignorePostRequest && <span className="property-badge">no POST</span>}
                                                                    {prop.ignorePutRequest && <span className="property-badge">no PUT</span>}
                                                                </div>
                                                                <div className="property-actions">
                                                                    <button 
                                                                        className="icon-btn danger"
                                                                        onClick={e => {
                                                                            e.stopPropagation();
                                                                            deleteProperty(currentEntity.name, idx);
                                                                        }}
                                                                    >
                                                                        🗑️
                                                                    </button>
                                                                </div>
                                                            </div>
                                                            
                                                            {isExpanded && (
                                                                <div className="property-details">
                                                                    <div className="form-row">
                                                                        <div className="form-group">
                                                                            <label className="form-label">Name</label>
                                                                            <input 
                                                                                className="form-input"
                                                                                value={prop.name}
                                                                                onChange={e => updateProperty(currentEntity.name, idx, { name: e.target.value })}
                                                                            />
                                                                        </div>
                                                                        <div className="form-group">
                                                                            <label className="form-label">Type</label>
                                                                            <select 
                                                                                className="form-input"
                                                                                value={prop.type}
                                                                                onChange={e => updateProperty(currentEntity.name, idx, { type: e.target.value })}
                                                                            >
                                                                                {(schema?.propertyTypes || ['string', 'int', 'long', 'bool', 'datetime', 'double']).map(t => (
                                                                                    <option key={t} value={t}>{t}</option>
                                                                                ))}
                                                                                {model.entities.map(e => (
                                                                                    <option key={e.name} value={e.name}>{e.name} (Entity)</option>
                                                                                ))}
                                                                            </select>
                                                                        </div>
                                                                    </div>
                                                                    
                                                                    <div className="form-group" style={{marginTop: '12px'}}>
                                                                        <label className="form-label">Options</label>
                                                                        <div className="checkbox-group">
                                                                            {[
                                                                                ['ignorePostRequest', 'Ignore POST'],
                                                                                ['ignorePutRequest', 'Ignore PUT'],
                                                                                ['includeInGet', 'Include in GET'],
                                                                                ['lightListProperty', 'Light List']
                                                                            ].map(([key, label]) => (
                                                                                <label 
                                                                                    key={key}
                                                                                    className={`checkbox-item ${prop[key] ? 'checked' : ''}`}
                                                                                >
                                                                                    <input 
                                                                                        type="checkbox"
                                                                                        checked={prop[key] || false}
                                                                                        onChange={e => updateProperty(currentEntity.name, idx, { [key]: e.target.checked })}
                                                                                    />
                                                                                    <span className="checkbox-label">{label}</span>
                                                                                </label>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                    
                                                                    {prop.includeInGet && (
                                                                        <div className="form-row" style={{marginTop: '12px'}}>
                                                                            <div className="form-group">
                                                                                <label className="form-label">Including Depth</label>
                                                                                <input 
                                                                                    className="form-input"
                                                                                    type="number"
                                                                                    value={prop.includingDeep || 0}
                                                                                    onChange={e => updateProperty(currentEntity.name, idx, { 
                                                                                        includingDeep: parseInt(e.target.value) || 0 
                                                                                    })}
                                                                                />
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                    
                                                                    <div className="relation-config">
                                                                        <div className="relation-title">🔗 Relation</div>
                                                                        <div className="form-row">
                                                                            <div className="form-group">
                                                                                <label className="form-label">Relation Type</label>
                                                                                <select 
                                                                                    className="form-input"
                                                                                    value={prop.relation?.type || ''}
                                                                                    onChange={e => {
                                                                                        if (!e.target.value) {
                                                                                            updateProperty(currentEntity.name, idx, { relation: null });
                                                                                        } else {
                                                                                            updateProperty(currentEntity.name, idx, { 
                                                                                                relation: {
                                                                                                    ...prop.relation,
                                                                                                    type: e.target.value,
                                                                                                    targetEntity: prop.relation?.targetEntity || '',
                                                                                                    targetPropertyName: prop.relation?.targetPropertyName || '',
                                                                                                    checkIfExists: prop.relation?.checkIfExists ?? true
                                                                                                }
                                                                                            });
                                                                                        }
                                                                                    }}
                                                                                >
                                                                                    <option value="">None</option>
                                                                                    <option value="OneToOne">OneToOne</option>
                                                                                    <option value="OneToMany">OneToMany</option>
                                                                                    <option value="ManyToOne">ManyToOne</option>
                                                                                </select>
                                                                            </div>
                                                                            {prop.relation && (
                                                                                <>
                                                                                    <div className="form-group">
                                                                                        <label className="form-label">Target Entity</label>
                                                                                        <select 
                                                                                            className="form-input"
                                                                                            value={prop.relation.targetEntity || ''}
                                                                                            onChange={e => updateProperty(currentEntity.name, idx, { 
                                                                                                relation: { ...prop.relation, targetEntity: e.target.value }
                                                                                            })}
                                                                                        >
                                                                                            <option value="">Select...</option>
                                                                                            {model.entities.map(e => (
                                                                                                <option key={e.name} value={e.name}>{e.name}</option>
                                                                                            ))}
                                                                                        </select>
                                                                                    </div>
                                                                                    <div className="form-group">
                                                                                        <label className="form-label">Target Property</label>
                                                                                        <input 
                                                                                            className="form-input"
                                                                                            value={prop.relation.targetPropertyName || ''}
                                                                                            placeholder="e.g. Books"
                                                                                            onChange={e => updateProperty(currentEntity.name, idx, { 
                                                                                                relation: { ...prop.relation, targetPropertyName: e.target.value }
                                                                                            })}
                                                                                        />
                                                                                    </div>
                                                                                </>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                                
                                                <button 
                                                    className="add-property-btn"
                                                    onClick={() => addProperty(currentEntity.name)}
                                                >
                                                    + Add Property
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                    
                    {toast && (
                        <div className={`toast ${toast.type}`}>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
